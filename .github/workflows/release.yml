name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Tag
        id: tag
        run: |
          set -eo pipefail

          # Generates a sortable timestamp: YYYY.MM.DD.HHMMSS. We append the SHA
          # for uniqueness.
          TAG_NAME="build-$(date +'%Y.%m.%d.%H%M%S')-${{ github.sha }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aeneas-linux-x86_64
            use_nix: true
          - os: macos-15-intel
            artifact_name: aeneas-macos-x86_64
            ocaml_compiler: 5.2.0
            use_nix: false
          - os: macos-latest
            artifact_name: aeneas-macos-aarch64
            ocaml_compiler: 5.2.0
            use_nix: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Nix
        if: matrix.use_nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Aeneas (Nix)
        if: matrix.use_nix
        run: nix build .#aeneas-static --extra-experimental-features "nix-command flakes" -L

      - uses: ocaml/setup-ocaml@v3
        if: "!matrix.use_nix"
        with:
          ocaml-compiler: ${{ matrix.ocaml_compiler }}
          # Disabling sandboxing is often necessary on GHA runners to avoid
          # bwrap errors (e.g., "Failed RTM_NEWADDR: Operation not permitted").
          opam-disable-sandboxing: true

      - name: Install dependencies
        if: "!matrix.use_nix"
        run: |
          set -eo pipefail

          # Explicitly install system-dependent opam packages to ensure
          # detection.
          opam install conf-gmp conf-libffi -y
          opam install ppx_deriving visitors easy_logging zarith yojson core_unix odoc \
            ocamlgraph menhir ocamlformat.0.27.0 unionFind zarith progress domainslib -y

      - name: Setup Charon
        if: "!matrix.use_nix"
        # 1. Make sure we've fetched the right Charon commit.
        run: make setup-charon

      - name: Build Aeneas
        if: "!matrix.use_nix"
        run: make

      - name: Package
        run: |
          set -eo pipefail

          mkdir -p staging
          BINARY_PATH="${{ matrix.use_nix && 'result/bin/aeneas' || 'bin/aeneas' }}"
          cp "$BINARY_PATH" staging/aeneas
          cp -r backends staging/
          cd staging
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz *

      # Verify the binary is functional.
      - name: Smoke Test
        run: |
          set -eo pipefail

          ./staging/aeneas --help > /dev/null
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Verify the binary is indeed statically linked (not a dynamic executable).
            (ldd ./staging/aeneas 2>&1 | grep "not a dynamic executable") || (echo "Binary is not statically linked!" && ldd ./staging/aeneas && exit 1)
          fi

      - name: Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: ${{ matrix.artifact_name }}.tar.gz
